services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # inside compose, services find each other by service name, not localhost
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD:-change-me}@postgres:5432/llm_gateway
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    # appendonly: write every change to disk so api keys survive a restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: llm_gateway
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d llm_gateway"]
      interval: 2s
      retries: 15

volumes:
  redis-data:
  pg-data:
